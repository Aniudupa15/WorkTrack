<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by `flutter build web --base-href`. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="PunchIn — GPS-verified attendance for teams. Manage your team, locations, leave and payroll exports.">
  <meta name="theme-color" content="#0F766E">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="PunchIn">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PunchIn</title>
  <link rel="manifest" href="manifest.json">

  <!-- Razorpay web Checkout (used by lib/features/billing/razorpay_checkout_web.dart). -->
  <script src="https://checkout.razorpay.com/v1/checkout.js" defer></script>

  <style>
    html, body { margin: 0; height: 100%; background: #F6F7F6; }
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #0F766E; transition: opacity .3s; }
    #loading img { width: 72px; height: 72px; }
  </style>
</head>
<body>
  <div id="loading"><img src="icons/Icon-192.png" alt="PunchIn"></div>
  <script>
    // Fade the branded placeholder once Flutter has drawn its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (!el) return;
      el.style.opacity = '0';
      setTimeout(function () { el.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
