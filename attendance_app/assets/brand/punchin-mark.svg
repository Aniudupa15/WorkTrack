<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- PunchIn mark: a punched time card whose hole is a "you are here" dot.
       White on transparent; the lines and the hole are cut out, so it works
       on any background (adaptive and themed icons, splash). -->
  <defs>
    <mask id="card" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <g transform="rotate(-10 50 50)">
        <rect x="20" y="29" width="60" height="42" rx="8" fill="#fff"/>
        <path d="M30 43h17M30 57h11" stroke="#000" stroke-width="5.5" stroke-linecap="round"/>
        <circle cx="63" cy="50" r="10.5" fill="#000"/>
        <circle cx="63" cy="50" r="3.8" fill="#fff"/>
      </g>
    </mask>
  </defs>
  <rect width="100" height="100" fill="#fff" mask="url(#card)"/>
</svg>
